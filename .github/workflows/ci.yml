name: CI
on:
  push:
    branches:
      - "**"
jobs:
  # Cheap detection so the Postgres-backed migration check only runs when something
  # it actually depends on changed. Mirrors migration-safety-pr.yml's `changes` job.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.detect.outputs.migrations }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so the merge-base resolves
      - id: detect
        run: |
          set -euo pipefail
          # src/config, src/schemas, src/errors and src/utils are here because db/seeds/
          # imports from them and db/ is not covered by tsconfig.json ("include" is
          # ./src/**/*), so nothing else would catch a seed break.
          # An array, not a space-separated string: passing "${PATHS[@]}" avoids
          # relying on unquoted word-splitting, which behaves differently across
          # shells (zsh does not split, so a string form silently matches nothing
          # when anyone dry-runs this locally on macOS).
          PATHS=(
            db/
            knexfile.ts
            src/db/knexConfig.ts
            package-lock.json
            src/config/
            src/schemas/
            src/errors/
            src/utils/
            .github/workflows/ci.yml
          )
          # This workflow runs on push, so there is no PR base SHA and
          # github.event.before is unreliable (all-zeros on a branch's first push,
          # wrong after a force-push). Let git resolve the fork point instead:
          # `git diff A...B` diffs from merge-base(A, B) to B.
          # On main the merge-base with itself is HEAD, which would make the range
          # empty, so compare against the previous commit — on a PR merge commit
          # HEAD^ is main's prior tip, which is what we want.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            BASE="HEAD^"
          else
            BASE="origin/main"
          fi
          if git diff --name-only "$BASE...HEAD" -- "${PATHS[@]}" | grep -q .; then
            CHANGED=true
          else
            CHANGED=false
          fi
          echo "migrations=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Migration-related files changed: $CHANGED"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run build
      - run: npm run test:types
      - run: npm test

  migration-check:
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.migrations == 'true'
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: mydb
      NODE_ENV: development
      APP_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run migrate:latest
        run: npm run migrate:latest
      - name: Run seed:run
        run: npm run seed:run
      - name: Run migrate:rollback
        run: npm run migrate:rollback -- --all

  # The single required status check for the migration run. Always runs so every push
  # gets a real result: green immediately when nothing migration-related changed,
  # otherwise the check's own outcome. Add THIS check to branch protection, not
  # `migration-check`.
  migration-check-gate:
    name: Migration Check Gate
    needs: [changes, migration-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the migration check to have passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MIGRATIONS: ${{ needs.changes.outputs.migrations }}
          # Bracket form is required: the job id contains a hyphen, and the expression
          # parser reads `needs.migration-check.result` as a subtraction.
          CHECK_RESULT: ${{ needs['migration-check'].result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Could not determine whether migrations changed (changes job: $CHANGES_RESULT)."
            exit 1
          fi
          if [ "$MIGRATIONS" != "true" ]; then
            echo "No migration-related changes in this push — nothing to check."
            exit 0
          fi
          # A skipped result here means `build` failed, so we cannot claim the
          # migrations are fine.
          if [ "$CHECK_RESULT" = "success" ]; then
            echo "Migration check passed."
            exit 0
          fi
          echo "::error::Migration check did not pass (result='$CHECK_RESULT')."
          exit 1
